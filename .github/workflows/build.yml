name: Release
on:
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          npm install
          npm install --prefix ui

      - name: Update Tauri configuration
        # This ensuring the bundle identifier and other fields are correct for release
        run: |
          # If needed, you can use jq to modify tauri.conf.json here
          echo "Building for ${{ matrix.platform }}"

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kern v${{ github.ref_name }}'
          releaseBody: 'See the assets below for the latest version of Kern Editor.'
          releaseDraft: true
          prerelease: false
          projectPath: . # Using root package.json for standard layout
